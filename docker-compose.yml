# Kafka (KRaft, no ZooKeeper) + PostgreSQL in Docker, for machines without the native
# Linux setup (infra/setup-kafka.sh, infra/setup-postgres.sh). Same ports, topics,
# credentials and schema, so every service runs unchanged against either setup.
#
#   docker compose up -d          # broker on :9092, warehouse on :5432
#   docker compose down           # stop (data kept in volumes)
#   docker compose down -v        # stop and wipe Kafka + warehouse data
services:
  kafka:
    image: apache/kafka:4.1.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two listeners: PLAINTEXT (localhost:9092) for our services on the host,
      # INTERNAL (kafka:29092) for other containers, e.g. kafka-topics below.
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"     # same as infra/server.properties.template
      KAFKA_LOG_RETENTION_HOURS: 72
    volumes: ["kafka-data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      retries: 20

  # One-shot: the same topics as infra/create-topics.sh. Idempotent (--if-not-exists).
  kafka-topics:
    image: apache/kafka:4.1.0
    depends_on: { kafka: { condition: service_healthy } }
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for t in security.events.raw:3 security.events.dlq:1 security.alerts:1 \
                 security.aggregates:1 security.pipeline.metrics:1 security.sim.campaigns:1; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
            --topic "$${t%%:*}" --partitions "$${t##*:}" --replication-factor 1 --config retention.ms=259200000
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list

  postgres:
    image: postgres:16-alpine
    # Host port: 5432 by default. If a native PostgreSQL already owns 5432 (common on
    # Windows), use PG_PORT=5433 and point the services at it:
    #   WAREHOUSE_DSN=postgresql://secops:secops@localhost:5433/secops
    ports: ["${PG_PORT:-5432}:5432"]
    environment:
      POSTGRES_USER: secops          # same role/db/password as infra/setup-postgres.sh
      POSTGRES_PASSWORD: secops
      POSTGRES_DB: secops
    volumes:
      - pg-data:/var/lib/postgresql/data
      # Applied on first start only. After editing schema.sql, re-apply with:
      #   docker compose exec -T postgres psql -U secops -d secops < warehouse/schema.sql
      - ./warehouse/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secops -d secops"]
      interval: 3s
      retries: 20

volumes:
  kafka-data:
  pg-data:
